[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "subject-nirs"
version = "0.1.0"
description = "Subject-aware DTOF representation learning and NIRS absolute-property prediction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "h5py>=3.8",
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.2",
  "scipy>=1.10",
  "torch>=2.0",
]

[project.optional-dependencies]
notebook = ["ipykernel>=6.25", "jupyterlab>=4.0", "seaborn>=0.12"]
test = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
